worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       "C:/Users/geeva/AppData/Local/Microsoft/WinGet/Packages/nginxinc.nginx_Microsoft.Winget.Source_8wekyb3d8bbwe/nginx-1.31.5/conf/mime.types";
    default_type  application/octet-stream;
    sendfile      on;

    # Bumped up for document uploads (backend allows up to 15MB per file).
    client_max_body_size 20m;

    server {
        listen 8080;
        server_name _;

        root "C:/Users/geeva/Desktop/SIH_v2/frontend/dist";
        index index.html;

        # React Router: any non-file path falls back to index.html.
        location / {
            try_files $uri /index.html;
        }

        # Reverse-proxied API — the phone talks to this same origin/port,
        # nginx forwards to the backend running locally on 5000.
        location /api/ {
            proxy_pass http://127.0.0.1:5000/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # nginx's default is 60s. The chat endpoint calls a local 14B
            # model synchronously (chat/ollamaChat.js's own timeout is 120s)
            # — a cold model load or a longer non-English generation can
            # legitimately exceed 60s, and nginx returning 504 before the
            # backend even finishes looks identical to a real failure on the
            # frontend (a 504's HTML body has no .message field, so it falls
            # through to the generic "Message failed to send" text instead
            # of a real error). Set above the backend's own timeout so nginx
            # never cuts off a request the backend would have completed.
            proxy_connect_timeout 10s;
            proxy_send_timeout 180s;
            proxy_read_timeout 180s;
        }
    }
}
